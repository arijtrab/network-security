# Lab réseau simulé : 3 « équipements » = 3 conteneurs Alpine (≈ 15 Mo chacun).
# Le déploiement copie la configuration validée dans /etc/netconfig de chaque conteneur.
services:
  router01:
    image: alpine:3.20
    container_name: lab-router01
    command: sleep infinity
    networks: [users, admin]
  firewall01:
    image: alpine:3.20
    container_name: lab-firewall01
    command: sleep infinity
    networks: [users, admin]
  switch01:
    image: alpine:3.20
    container_name: lab-switch01
    command: sleep infinity
    networks: [users]
networks:
  users: {driver: bridge, ipam: {config: [{subnet: 192.168.10.0/24}]}}
  admin: {driver: bridge, ipam: {config: [{subnet: 192.168.99.0/24}]}}
