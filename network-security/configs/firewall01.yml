# Pare-feu périmétrique : configuration conforme (baseline)
device: firewall01
type: firewall
zones:
  internet: {cidr: 0.0.0.0/0}
  users:    {cidr: 192.168.10.0/24}
  admin:    {cidr: 192.168.99.0/24, sensitive: true}
  servers:  {cidr: 10.0.0.0/24}
management:
  ssh:
    enabled: true
    version: 2
    port: 22
    idle_timeout: 300
    allowed_sources: ["192.168.10.0/24"]
  telnet: {enabled: false}
  ftp: {enabled: false}
  http_admin: {enabled: false}
  snmp: {enabled: true, version: 3, community: "${SNMP_COMMUNITY}"}
  admin_password: "${ADMIN_PASSWORD}"
logging: {enabled: true, server: 192.168.10.50}
default_policy: deny
rules:
  - {id: 10, action: allow, src: users,    dst: servers,  port: 443, proto: tcp, description: "Clients vers serveur web"}
  - {id: 20, action: allow, src: internet, dst: servers,  port: 443, proto: tcp, description: "Site web public"}
  - {id: 30, action: allow, src: admin,    dst: servers,  port: 22,  proto: tcp, description: "Administration des serveurs"}
  - {id: 40, action: allow, src: users,    dst: internet, port: 443, proto: tcp, description: "Navigation web"}
  - {id: 90, action: deny,  src: any,      dst: any,      port: any, proto: any, log: true, description: "Deny explicite"}
