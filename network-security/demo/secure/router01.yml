# Routeur de coeur : configuration conforme
device: router01
type: router
management:
  ssh:
    enabled: true
    version: 2
    port: 22
    idle_timeout: 300
    allowed_sources: ["192.168.10.0/24"]
  telnet: {enabled: false}
  ftp: {enabled: false}
  http_admin: {enabled: false}
  snmp: {enabled: true, version: 3, community: "${SNMP_COMMUNITY}"}
  admin_password: "${ADMIN_PASSWORD}"
logging: {enabled: true, server: 192.168.10.50}
routing:
  protocol: ospf
  authentication: sha256
rules:
  - {id: 10, action: allow, src: 192.168.10.0/24, dst: 10.0.0.0/24, port: 443, proto: tcp, description: "ACL utilisateurs vers serveurs"}
  - {id: 99, action: deny,  src: any, dst: any, port: any, proto: any, log: true}
