# Politique de sécurité réseau : modifiable sans toucher au code ni aux configurations.
# Types de contrôles disponibles : voir scripts/security_check.py (CHECKS).
version: "1.0"

decision:
  blocking_severities: [CRITICAL, HIGH, MEDIUM]   # LOW = avertissement, ne bloque pas
  mandatory_rules: [NET-001, NET-002, NET-003, NET-004, NET-008, SEC-001, LOG-001]

rules:
  # --- Services non sécurisés -------------------------------------------------
  - id: NET-001
    title: Telnet activé
    severity: HIGH
    iso: A.8.21
    recommendation: Désactiver Telnet (management.telnet.enabled=false) et utiliser SSH v2.
    check: {type: forbidden_value, path: management.telnet.enabled, forbidden: [true], message: "Telnet is enabled"}
  - id: NET-002
    title: FTP activé
    severity: HIGH
    iso: A.8.21
    recommendation: Désactiver FTP ; utiliser SFTP/SCP si un transfert de fichiers est nécessaire.
    check: {type: forbidden_value, path: management.ftp.enabled, forbidden: [true], message: "FTP is enabled"}
  - id: NET-003
    title: Administration HTTP activée
    severity: HIGH
    iso: A.8.21
    recommendation: Désactiver l'administration HTTP ou la remplacer par HTTPS restreint.
    check: {type: forbidden_value, path: management.http_admin.enabled, forbidden: [true], message: "HTTP administration is enabled"}

  # --- Accès administratif (SSH) ---------------------------------------------
  - id: NET-004
    title: SSH accessible depuis 0.0.0.0/0
    severity: CRITICAL
    iso: A.8.20
    recommendation: Restreindre management.ssh.allowed_sources au réseau d'administration (ex. 192.168.10.0/24).
    check: {type: ssh_sources, mode: any}
  - id: NET-005
    title: SSH sans restriction d'adresse source
    severity: HIGH
    iso: A.5.15
    recommendation: Définir management.ssh.allowed_sources avec au moins un réseau de confiance.
    check: {type: ssh_sources, mode: missing}
  - id: NET-006
    title: Accès administratif trop large
    severity: HIGH
    iso: A.5.15
    recommendation: Utiliser un préfixe /24 ou plus précis pour les sources autorisées en SSH.
    check: {type: ssh_sources, mode: wide, min_prefix: 24}
  - id: NET-007
    title: SSH version 1 autorisée
    severity: HIGH
    iso: A.8.24
    recommendation: Imposer SSH version 2 (management.ssh.version=2).
    check: {type: forbidden_value, path: management.ssh.version, forbidden: [1], when: management.ssh.enabled, message: "SSH protocol version 1"}

  # --- Filtrage / ACL ---------------------------------------------------------
  - id: NET-008
    title: Règle ANY vers ANY autorisée
    severity: CRITICAL
    iso: A.8.20
    recommendation: Remplacer la règle par des autorisations explicites (source, destination, port) et garder un deny final.
    check: {type: any_any}
  - id: NET-009
    title: Port dangereux ouvert depuis une source large
    severity: HIGH
    iso: A.8.20
    recommendation: Fermer le port ou limiter la source à un réseau /24 de confiance.
    check: {type: dangerous_ports, ports: [20, 21, 23, 69, 135, 137, 139, 445, 1433, 3306, 3389, 5900], max_broad_prefix: 24}
  - id: NET-010
    title: Règle d'autorisation sans restriction d'adresse source
    severity: MEDIUM
    iso: A.8.20
    recommendation: Préciser une zone ou un réseau source (hors services publics 80/443).
    check: {type: source_restriction, public_ports: [80, 443]}
  - id: NET-011
    title: Accès à une zone sensible depuis une source large
    severity: CRITICAL
    iso: A.8.22
    recommendation: Interdire tout flux d'Internet ou d'une source large vers une zone sensible.
    check: {type: sensitive_zone_access, max_broad_prefix: 24}

  # --- Protocoles obsolètes ---------------------------------------------------
  - id: NET-012
    title: SNMP v1/v2c utilisé
    severity: HIGH
    iso: A.8.24
    recommendation: Migrer vers SNMPv3 avec authentification et chiffrement.
    check: {type: forbidden_value, path: management.snmp.version, forbidden: [1, "2c"], when: management.snmp.enabled, message: "Obsolete SNMP version"}
  - id: NET-013
    title: Protocole de routage obsolète (RIP v1)
    severity: MEDIUM
    iso: A.8.24
    recommendation: Utiliser OSPF ou BGP avec authentification cryptographique.
    check: {type: forbidden_value, path: routing.protocol, forbidden: [rip1], message: "Obsolete routing protocol"}

  # --- Secrets ----------------------------------------------------------------
  - id: SEC-001
    title: Mot de passe ou secret en clair dans la configuration
    severity: CRITICAL
    iso: A.5.17
    recommendation: Remplacer la valeur par une référence ${VARIABLE} résolue par le gestionnaire de secrets (variables CI masquées).
    check: {type: plaintext_secrets}

  # --- Journalisation ---------------------------------------------------------
  - id: LOG-001
    title: Journalisation non activée
    severity: MEDIUM
    iso: A.8.15
    recommendation: Activer logging.enabled et envoyer les journaux vers un serveur central.
    check: {type: required_value, path: logging.enabled, equals: true, message: "Logging disabled"}
  - id: LOG-002
    title: Aucun serveur de journaux distant
    severity: LOW
    iso: A.8.15
    recommendation: Renseigner logging.server (syslog central).
    check: {type: required_value, path: logging.server, exists: true, message: "No remote log server"}

  # --- Spécifique switch ------------------------------------------------------
  - id: SW-001
    title: Ports inutilisés non désactivés
    severity: MEDIUM
    iso: A.8.20
    applies_to: [switch]
    recommendation: Passer switch.unused_ports_shutdown à true.
    check: {type: required_value, path: switch.unused_ports_shutdown, equals: true, message: "Unused ports are not shut down"}
  - id: SW-002
    title: VLAN natif laissé à 1
    severity: MEDIUM
    iso: A.8.22
    applies_to: [switch]
    recommendation: Utiliser un VLAN natif dédié et inutilisé (ex. 99).
    check: {type: forbidden_value, path: switch.native_vlan, forbidden: [1], message: "Native VLAN is 1"}

  # --- Durcissement (iso volontairement vide : suggéré par le modèle ML) -------
  - id: CFG-001
    title: Délai d'inactivité de session SSH non défini
    severity: MEDIUM
    iso: null
    recommendation: Définir management.ssh.idle_timeout (300 s maximum).
    check: {type: required_value, path: management.ssh.idle_timeout, exists: true, when: management.ssh.enabled, message: "SSH idle timeout not configured"}
