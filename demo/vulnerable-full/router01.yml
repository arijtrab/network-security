# DÉMO : routeur avec protocole obsolète et secret en clair
device: router01
type: router
management:
  ssh: {enabled: true, version: 1, port: 22, allowed_sources: ["10.0.0.0/8"]}
  telnet: {enabled: false}
  ftp: {enabled: false}
  http_admin: {enabled: true}
  snmp: {enabled: true, version: "2c", community: "public"}
logging: {enabled: true}
routing: {protocol: rip1}
rules:
  - {id: 10, action: allow, src: any, dst: 10.0.0.0/24, port: 445, proto: tcp}
