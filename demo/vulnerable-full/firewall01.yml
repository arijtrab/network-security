# DÉMO : configuration volontairement vulnérable (scénario 2)
device: firewall01
type: firewall
zones:
  internet: {cidr: 0.0.0.0/0}
  users:    {cidr: 192.168.10.0/24}
  admin:    {cidr: 192.168.99.0/24, sensitive: true}
  servers:  {cidr: 10.0.0.0/24}
management:
  ssh:
    enabled: true
    version: 2
    port: 22
    allowed_sources: ["0.0.0.0/0"]
  telnet: {enabled: true}
  ftp: {enabled: true}
  http_admin: {enabled: false}
  snmp: {enabled: true, version: 3, community: "${SNMP_COMMUNITY}"}
  admin_password: "Admin123!"
logging: {enabled: false}
default_policy: allow
rules:
  - {id: 5,  action: allow, src: any,      dst: any,     port: any,  proto: any, description: "Règle temporaire de test"}
  - {id: 10, action: allow, src: internet, dst: admin,   port: 22,   proto: tcp, description: "Accès SSH direct"}
  - {id: 20, action: allow, src: internet, dst: servers, port: 3389, proto: tcp, description: "RDP ouvert"}
  - {id: 90, action: deny,  src: any,      dst: any,     port: any,  proto: any}
