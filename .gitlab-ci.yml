# Pipeline DevSecOps : Validation -> Scan -> Conformité (décision) -> Tests réseau -> Déploiement -> Rapport
# Un job en échec bloque automatiquement les stages suivants : c'est la « barrière de sécurité ».
stages: [validate, scan, compliance, network-test, deploy, report]

default:
  image: python:3.12-slim        # ignoré si le runner utilise l'exécuteur « shell »
  tags: [lab]                    # runner installé sur la VM ; retirer cette ligne pour utiliser les runners partagés
  before_script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install -q -r requirements.txt

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                # évite les pipelines en double (branche + MR)
    - if: $CI_COMMIT_BRANCH

yamllint:
  stage: validate
  script: yamllint -c .yamllint configs/ policies/

syntax-check:
  stage: validate
  script: python scripts/validate.py

unit-tests:
  stage: validate
  script: pytest -q

secrets-gitleaks:               # optionnel : actif seulement si gitleaks est installé sur le runner
  stage: scan
  allow_failure: true
  script:
    - 'command -v gitleaks >/dev/null && gitleaks detect --source . --no-banner || echo "gitleaks absent : étape ignorée"'

security-scan:
  stage: scan
  script: python scripts/security_check.py --out report.json
  artifacts:
    when: always
    paths: [report.json]

compliance-check:               # LA DÉCISION : exit 1 => pipeline en échec => déploiement bloqué
  stage: compliance
  script: python scripts/compliance.py --report report.json --out verdict.json
  artifacts:
    when: always
    paths: [verdict.json]

network-policy-check:
  stage: network-test
  script: python scripts/flow_test.py --out network_tests.json
  artifacts:
    when: always
    paths: [network_tests.json]

deploy-lab:
  stage: deploy
  script: python scripts/deploy.py --verdict verdict.json --out deployment.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths: [deployment.json]

report-and-notify:
  stage: report
  when: always                  # s'exécute même si un stage précédent a échoué
  allow_failure: true
  script:
    - python ml/train.py > /dev/null 2>&1 || true   # entraînement déterministe (≈ 3 s) : évite tout souci de version de pickle
    - python ml/classify.py
    - python scripts/notify.py
  artifacts:
    when: always
    expire_in: 90 days
    paths: [report.md, report.json, verdict.json, network_tests.json, report_enriched.json]
